name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test -- --passWithNoTests
      # Project pages live under /okoshi/. With a custom domain, set BASE_PATH to "/".
      - run: npm run build
        env:
          BASE_PATH: /okoshi/
      # With a base path, pages are prerendered into build/client/okoshi/ and the SPA fallback is index.html.
      # Pages serves the artifact root at /okoshi/, so lift the pages to the root and keep the fallback as 404.html.
      - run: |
          cp build/client/index.html build/client/404.html
          cp -R build/client/okoshi/. build/client/
          rm -rf build/client/okoshi
          touch build/client/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
